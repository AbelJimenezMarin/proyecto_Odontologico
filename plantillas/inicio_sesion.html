<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - Consultorio NADINNE</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/disposicion.css">
    <link rel="stylesheet" href="css/responsivo.css">
</head>

<body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" id="iconos-sprite">

        </symbol>
        <symbol id="icono-panel" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="9" rx="1"/>
            <rect x="14" y="3" width="7" height="5" rx="1"/>
            <rect x="14" y="12" width="7" height="9" rx="1"/>
            <rect x="3" y="16" width="7" height="5" rx="1"/>
        </symbol>
        <symbol id="icono-pacientes" viewBox="0 0 24 24">
            <circle cx="9" cy="8" r="3.5"/>
            <path d="M2.5 20c0-3.5 2.9-6 6.5-6s6.5 2.5 6.5 6"/>
            <path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.3c2 .8 3.5 2.7 3.5 5.7"/>
        </symbol>
        <symbol id="icono-citas" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
        <symbol id="icono-atencion" viewBox="0 0 24 24">
            <rect x="5" y="4" width="14" height="17" rx="2"/>
            <path d="M9 4V3h6v1M9 12l2 2 4-4"/>
        </symbol>
        <symbol id="icono-pagos" viewBox="0 0 24 24">
            <rect x="2.5" y="5" width="19" height="14" rx="2"/>
            <path d="M2.5 10h19M6.5 15h4"/>
        </symbol>
        <symbol id="icono-salir" viewBox="0 0 24 24">
            <path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M16 8l4 4-4 4M20 12H9"/>
        </symbol>
        <symbol id="icono-menu" viewBox="0 0 24 24">
            <path d="M4 6h16M4 12h16M4 18h16"/>
        </symbol>
        <symbol id="icono-buscar" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/>
            <path d="M20 20l-3.5-3.5"/>
        </symbol>
        <symbol id="icono-guardar" viewBox="0 0 24 24">
            <path d="M5 12.5l4.5 4.5L19 7.5"/>
        </symbol>
        <symbol id="icono-mas" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14"/>
        </symbol>
        <symbol id="icono-ver" viewBox="0 0 24 24">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
            <circle cx="12" cy="12" r="3"/>
        </symbol>
        <symbol id="icono-confirmar" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M8 12.5l3 3 5-6"/>
        </symbol>
        <symbol id="icono-reprogramar" viewBox="0 0 24 24">
            <path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v4h-4"/>
        </symbol>
        <symbol id="icono-cancelar" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M9 9l6 6M15 9l-6 6"/>
        </symbol>
        <symbol id="icono-dinero" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v10M9.5 9.5c0-1 1-1.8 2.5-1.8s2.5.8 2.5 1.8-1 1.6-2.5 1.9-2.5.9-2.5 1.9 1 1.8 2.5 1.8 2.5-.8 2.5-1.8"/>
        </symbol>
        <symbol id="icono-editar" viewBox="0 0 24 24">
            <path d="M4 20h4L19 9l-4-4L4 16v4z"/>
            <path d="M13.5 6.5l4 4"/>
        </symbol>
    </svg>

<main class="pagina-acceso" id="pagina-acceso">
    <div class="caja-acceso" id="caja-acceso">
        <div class="logotipo" id="logotipo">
            <svg class="icono" aria-hidden="true">
                <use href="#icono-diente"></use>
            </svg>Consultorio Odontológico NADINNE
            <small>Sistema de gestión de citas y tratamientos</small>
        </div>
    <h1 id="titulo-inicio-sesion">Iniciar sesión</h1>
    <form id="formulario-inicio-sesion" method="post" action="panel_principal.html" novalidate>
        <div class="campo">
            <label class="etiqueta" for="campo-usuario">Usuario</label>
            <input class="entrada" type="text" id="campo-usuario" name="usuario" autocomplete="username" placeholder="Ingrese su usuario">
        </div>
        
        <div class="campo">
            <label class="etiqueta" for="campo-clave">Contraseña</label>
            <input class="entrada" type="password" id="campo-clave" name="clave" autocomplete="current-password" placeholder="Ingrese su contraseña">
        </div>
        
        <div id="mensaje-error" role="alert"></div>
        
        <button class="boton boton-primario boton-bloque" type="submit" id="boton-ingresar">Ingresar</button>
        
        <p class="enlace-ayuda">
            <a href="#" id="enlace-recuperar-clave">¿Olvidó su contraseña?</a>
        </p>
    </form>
    </div>
</main>

<script src="js/principal.js"></script>
</body>
</html>
